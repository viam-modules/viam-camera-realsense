name: Publish conan packages

# Publishes module-side Conan dependencies (librealsense, libusb,
# and optionally viam-camera-realsense itself) to the viamconan
# remote so cloud builds get cache hits instead of rebuilding from
# source. Matrix targets the same debian:bookworm + arch combinations
# that Viam's cloud builder uses (see meta.json `distro` field).

on:
  # Manual only — fire from the Actions tab (or `gh workflow run`) when
  # librealsense/libusb versions change and need re-publishing.
  workflow_dispatch:
    inputs:
      upload_module:
        description: "Also upload viam-camera-realsense/* (off by default — only needed if consumers will pull it from Conan)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            image: debian:bookworm
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            image: debian:bookworm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    # Job-level so every step that touches the remote (build + upload) has
    # credentials. Conan auto-uses CONAN_LOGIN_USERNAME_<REMOTE> /
    # CONAN_PASSWORD_<REMOTE> to authenticate, so no step needs an explicit
    # login and uploads never fall back to an interactive prompt (EOFs in CI).
    # The remote URL itself is added by `make setup` (bin/setup.sh).
    env:
      CONAN_LOGIN_USERNAME_VIAMCONAN: ${{ secrets.CONAN_USERNAME }}
      CONAN_PASSWORD_VIAMCONAN: ${{ secrets.CONAN_PASSWORD }}

    steps:
      - name: Install make + sudo (container is minimal)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            make sudo git ca-certificates

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run setup (installs conan + adds viamconan remote)
        run: make setup

      - name: Verify viamconan auth (fail fast before the long build)
        # Credentials come from the job-level env. This step just forces an
        # auth handshake so bad creds fail here in seconds, not after the build.
        run: |
          . ./venv/bin/activate
          conan remote auth --force -cc core:non_interactive=True viamconan

      - name: Build dependency graph (conan create)
        run: |
          . ./venv/bin/activate
          # Same flags the Makefile uses for module.tar.gz, ensuring the
          # package_ids we publish are what the cloud builder asks for.
          conan create . \
            -o "&:with_tests=False" \
            -s:a build_type=Release \
            -s:a compiler.cppstd=17 \
            --lockfile conan.lock \
            --build=missing

      - name: Upload librealsense and libusb binaries
        run: |
          . ./venv/bin/activate
          conan upload "librealsense/*" -r viamconan -c
          conan upload "libusb/*" -r viamconan -c

      - name: Upload module recipe + binary (optional)
        if: inputs.upload_module
        run: |
          . ./venv/bin/activate
          conan upload "viam-camera-realsense/*" -r viamconan -c
