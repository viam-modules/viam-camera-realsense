name: Publish conan packages

# Publishes librealsense/libusb binaries to viamconan so cloud builds hit cache instead of rebuilding.
# Run manually when the librealsense or libusb version changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        # bookworm binaries serve the cloud builder (meta.json distro);
        # jammy binaries serve the CI/release legs; macos-26 serves the mac
        # test leg (toolchain pinned in etc/conan/module.profile).
        include:
          - runner: ubuntu-22.04
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-debian:bookworm
          - runner: ubuntu-22.04-arm
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-debian:bookworm
          - runner: ubuntu-22.04
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy
          - runner: ubuntu-22.04-arm
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy
          - runner: macos-26
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      CONAN_LOGIN_USERNAME_VIAMCONAN: ${{ secrets.CONAN_USERNAME }}
      CONAN_PASSWORD_VIAMCONAN: ${{ secrets.CONAN_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install conan (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config conan
          conan profile detect || true
          conan remote add viamconan https://viam.jfrog.io/artifactory/api/conan/viamconan --index 0 --force

      - name: Verify viamconan auth (fail fast before the long build)
        run: conan remote auth --force -cc core:non_interactive=True viamconan

      - name: Build dependency graph (conan create)
        # Same profile as bin/build.sh so published package_ids match the cloud builder's.
        run: |
          conan create . \
            -o "&:with_tests=False" \
            -pr:a ./etc/conan/module.profile \
            --build=missing

      - name: Upload module dependency binaries
        # Realsense-only deps the SDK's publish can never provide; the server
        # skips revisions it already has.
        run: |
          for pkg in librealsense libusb libjpeg-turbo libcurl libzip lz4 zstd xz_utils; do
            conan upload "$pkg/*" -r viamconan -c
          done
